# @seamlabs/dsh-rlm — top-level YAML array of loader patch entries.
# Not a cordis.yml object. Later layers win per row; a patch replaces
# the targeted row's whole `config`. `name` on an id-targeted patch is
# a match guard, not a rename — so we disable the web-app worker-thread
# row and insert our own.
#
# Do NOT set tools.mode=code globally. That collapses every subagent to
# run_code-only, so a child asked to "Review auth/" walks the disk for
# 70 cells and never goes idle. Code presentation is applied per parent
# agent in rlm-persona (tools.presentAs on agent.ctx).

- id: code-runtime
  disabled: true

- insert:
    - id: rlm-runtime
      name: '@seamlabs/dsh-rlm/runtime'
      config:
        maxDepth: 2
    - id: rlm-bindings
      name: '@seamlabs/dsh-rlm/bindings'
    - id: rlm-persona
      name: '@seamlabs/dsh-rlm/persona'
      config:
        maxDepth: 2
    - id: rlm-snapshot
      name: '@seamlabs/dsh-rlm/snapshot'